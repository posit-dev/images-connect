name: Development
on:
  schedule:
    # Daily rebuild of dev images. Staggered with images-package-manager
    # (07:45) and images-workbench (09:45) so the three products don't
    # all build in the same hour. Weeklies run at 01–03 UTC, dailies at
    # 07–09 UTC, with 04–06 UTC reserved as growth headroom.
    - cron: "45 8 * * *" # At 08:45 every day

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: "CDN-formatted version string (e.g. '2026.06.0-dev+159-gfc86f5da40'). When set, bakery asserts the CDN manifest matches before building."
        required: false
        type: string
      channel:
        description: "Dev channel to build (e.g. 'daily'). When set, only that channel is built."
        required: false
        type: string
      stream:
        description: "Deprecated: use channel instead."
        required: false
        type: string


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # This should be the only action checked as required in the repo settings.
    #
    # This is a meta-job, here to express the conditions we require
    # in order to consider a CI run to be successful.
    if: always()

    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    needs:
      - build

    steps:
      - uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe  # v1.2.2
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
      - if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  build:
    name: Build
    # Build all development versions of each image in parallel.
    permissions:
      contents: read
      packages: write
      id-token: write

    uses: "posit-dev/images-shared/.github/workflows/bakery-build-native.yml@main"
    secrets:
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
    with:
      dev-versions: "only"
      matrix-versions: "exclude"
      dev-version: ${{ inputs.version }}
      dev-channel: ${{ inputs.channel || inputs.stream }}
      temp-registry: "565037064999.dkr.ecr.us-east-2.amazonaws.com/images"
      # Push on merges to main, scheduled rebuilds, and dispatches targeting main.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
