name: Production
on:
  workflow_dispatch:

  schedule:
    # Weekly rebuild of all images, to pick up any upstream changes.
    # Staggered with images-package-manager production (01:15 Sun) and
    # images-workbench production (03:15 Sun) so the three products
    # don't all build in the same hour. Connect content shares this hour
    # at minute 45.
    - cron: "15 2 * * 0" # At 02:15 on Sunday

  push:
    branches:
      - main


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # This should be the only action checked as required in the repo settings.
    #
    # This is a meta-job, here to express the conditions we require
    # in order to consider a CI run to be successful.
    if: always()

    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 10
    needs:
      - build
      - update-helm

    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35  # v1.3.0
        id: alls-green
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: update-helm
      # Cancelled builds fire an alert that never clears — slack-build-notify
      # skips cancelled runs when scanning for recovery. The next run carries
      # the real verdict; silence here is correct.
      - if: always() && github.ref == 'refs/heads/main' && needs.build.result != 'cancelled'
        continue-on-error: true
        uses: posit-dev/images-shared/.github/actions/slack-build-notify@main
        with:
          result: ${{ steps.alls-green.outcome }}
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  # Jobs that call a reusable workflow via `uses:` can't also set
  # `environment:`, so the branch restriction lives in its own job and
  # build depends on it.
  main-only:
    name: Main Only
    runs-on: ubuntu-latest
    permissions: {}
    environment: production
    steps:
      - run: echo "Branch allowed by environment policy."

  build:
    name: Build
    # Build all images, excluding dev versions and matrix versions.
    #
    # Builds all versions of each image in parallel.
    needs:
      - main-only
    permissions:
      contents: read
      packages: write
      id-token: write

    uses: "posit-dev/images-shared/.github/workflows/bakery-build-native.yml@main"
    secrets:
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      DOCKER_HUB_README_USERNAME: ${{ secrets.DOCKER_HUB_README_USERNAME }}
      DOCKER_HUB_README_PASSWORD: ${{ secrets.DOCKER_HUB_README_PASSWORD }}
      WIZ_CLIENT_ID: ${{ secrets.WIZ_CLIENT_ID }}
      WIZ_CLIENT_SECRET: ${{ secrets.WIZ_CLIENT_SECRET }}
      WIZ_POLICY_ID: ${{ secrets.WIZ_POLICY_ID }}
      WIZ_PROJECT_ID: ${{ secrets.WIZ_PROJECT_ID }}
    with:
      dev-versions: "exclude"
      matrix-versions: "exclude"
      # Push images only for merges into main and weekly schduled re-builds.
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}

  update-helm:
    name: Update Helm
    if: ${{ needs.build.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install bakery
        uses: posit-dev/images-shared/setup-bakery@main

      - name: Get latest version
        id: version
        run: |
          APP_VERSION=$(bakery get version connect)
          APP_VERSION="${APP_VERSION%%[+-]*}"
          echo "app-version=$APP_VERSION" >> "$GITHUB_OUTPUT"

          PYTHON_VERSION=$(yq '
            .images[] | select(.name == "connect") |
            .versions[] | select(.latest == true) |
            .dependencies[] | select(.dependency == "python") |
            .version
          ' bakery.yaml)
          if [ -z "$PYTHON_VERSION" ]; then
            echo "::error::Could not read Python version from bakery.yaml"
            exit 1
          fi
          echo "python-version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.POSIT_CONNECT_PROJECTS_APP_ID }}
          private-key: ${{ secrets.POSIT_CONNECT_PROJECTS_PEM }}
          owner: rstudio
          repositories: helm
          permission-actions: write

      - name: Dispatch Helm update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          PYTHON_VERSION: ${{ steps.version.outputs.python-version }}
        run: |
          gh workflow run product-release.yml \
            --repo rstudio/helm \
            --field product=connect \
            --field version="$APP_VERSION" \
            --field python_version="$PYTHON_VERSION"
