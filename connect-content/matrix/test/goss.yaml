package:
  {{ $apt_package_list_path := printf "/tmp/version/deps/%s-%s_packages.txt" .Env.IMAGE_OS_NAME .Env.IMAGE_OS_VERSION }}
  {{ $apt_package_list := readFile $apt_package_list_path | splitList "\n" }}
  {{- range $apt_package_list }}
  {{.}}:
    installed: true
  {{end}}
  rstudio-drivers:
    installed: {{ if eq .Env.IMAGE_VARIANT "pro" }}true{{ else }}false{{ end }}
  quarto:
    installed: true
    versions:
      - {{ .Env.BUILD_ARG_QUARTO_VERSION }}

file:
  python-{{ .Env.BUILD_ARG_PYTHON_VERSION }}:
    exists: true
    path: /opt/python/{{ .Env.BUILD_ARG_PYTHON_VERSION }}
  r-{{ .Env.BUILD_ARG_R_VERSION }}:
    exists: true
    path: /opt/R/{{ .Env.BUILD_ARG_R_VERSION }}
  quarto:
    exists: true
    path: /opt/quarto/bin/quarto
  # TinyTeX is installed under /opt/.TinyTeX; tlmgr path add symlinks binaries into /usr/local/bin.
  /opt/.TinyTeX:
    exists: true
    filetype: directory
  /usr/local/bin/tlmgr:
    exists: true
    filetype: symlink
  /usr/local/bin/pdflatex:
    exists: true
    filetype: symlink

command:
  "Verify R installation is version {{ .Env.BUILD_ARG_R_VERSION }}":
    exec: /opt/R/{{ .Env.BUILD_ARG_R_VERSION }}/bin/R --version
    exit-status: 0
    stdout:
      - "R version {{ .Env.BUILD_ARG_R_VERSION }}"
  "Verify Python installation is version {{ .Env.BUILD_ARG_PYTHON_VERSION }}":
    exec: /opt/python/{{ .Env.BUILD_ARG_PYTHON_VERSION }}/bin/python --version
    exit-status: 0
    stdout:
      - "{{ .Env.BUILD_ARG_PYTHON_VERSION }}"
  "Verify Quarto":
    exec: /usr/local/bin/quarto check --quiet
    exit-status: 0
  "Verify Quarto has TinyTeX installed":
    exec: "HOME='/opt' quarto list tools"
    exit-status: 0
    stderr:
      - "/tinytex\\s+Up to date/"
  "Verify TinyTeX is readable and executable by a non-root user":
    exec: su -s /bin/sh -c 'command -v tlmgr && command -v pdflatex && tlmgr --version && pdflatex --version' nobody
    exit-status: 0
    stdout:
      - "tlmgr"
      - "pdfTeX"
  "Verify quarto package is held":
    # Guards against apt upgrade drifting quarto off the pinned version.
    exec: apt-mark showhold
    exit-status: 0
    stdout:
      - "/^quarto$/"
  "Verify R odbc package is installed":
    exec: /opt/R/{{ .Env.BUILD_ARG_R_VERSION }}/bin/R -e "library(odbc)"
    exit-status: 0
    skip: {{ if ne .Env.IMAGE_VARIANT "pro" }}true{{ else }}false{{ end }}
  "Verify ODBC drivers are configured":
    exec: cat /etc/odbcinst.ini
    exit-status: 0
    stdout:
      - "/PostgreSQL|MySQL|SQLServer/"
    skip: {{ if ne .Env.IMAGE_VARIANT "pro" }}true{{ else }}false{{ end }}
